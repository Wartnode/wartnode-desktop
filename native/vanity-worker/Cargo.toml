[package]
name = "wartnode-vanity"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]
vanity-pro = { path = "../../vendor/vanity-pro", default-features = false }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
